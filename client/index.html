<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a1f">
<title>Sir Palaniyandavar Info Tech</title>
<meta name="description" content="Certificates, ration card, voter ID and Aadhaar applications, followed for you, with updates on WhatsApp.">
<style>
body { margin: 0; background: #1f2a1f; } /* the site's own styles replace this once they load */
/* The loading screen. It is in the page itself, so it shows at once, even on slow
   internet, before the site's scripts arrive. React replaces it when it starts. */
.splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 22px; padding: 24px; background: #1f2a1f; color: #f3edde; font: 400 16px/1.4 system-ui, sans-serif; text-align: center; }
.splash-mark { position: relative; width: 96px; height: 96px; display: grid; place-items: center; }
.splash-mark img, .splash-mono { position: relative; width: 88px; height: 88px; border-radius: 24px; box-shadow: 0 10px 30px -8px rgba(0, 0, 0, .5); }
.splash-mono { display: grid; place-items: center; background: #3e5a3f; color: #d9c7a3; font-size: 34px; font-weight: 700; letter-spacing: .02em; }
.splash-ring { position: absolute; inset: 4px; border: 2px solid #d9c7a3; border-radius: 28px; opacity: 0; animation: splash-ring 1.8s ease-out infinite; }
.splash-ring.r2 { animation-delay: .9s; }
.splash-title { margin: 0; font-size: 26px; font-weight: 700; color: #fff; }
.splash-sub { margin: 4px 0 0; color: #d9c7a3; font-size: 14px; }
.splash-bar { width: 160px; height: 4px; border-radius: 4px; overflow: hidden; background: rgba(217, 199, 163, .2); }
.splash-bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #b08d57; animation: splash-bar 1.2s ease-in-out infinite; }
.splash-line { margin: 0; min-height: 1.4em; color: rgba(243, 237, 222, .78); font-size: 15px; }
.splash .for-calls, html.is-calls .splash .for-site { display: none; }
html.is-calls .splash .for-calls { display: revert; }
html.is-calls .splash .splash-ring { display: block; }
.splash .splash-ring { display: none; }
@keyframes splash-ring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.55); opacity: 0; } }
@keyframes splash-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .splash-ring { animation: none; } .splash-bar i { animation-duration: 3s; } }
</style>
<script>
  // Pick the phone app's look and the language before anything is drawn.
  (function () {
    var calls = location.pathname === '/calls';
    var ta = false;
    try { ta = localStorage.getItem('lang') === 'ta'; } catch (e) {}
    if (calls) document.documentElement.classList.add('is-calls');
    window.__splashText = {
      title: calls ? (ta ? 'அழைப்புகள்' : 'Calls') : 'Sir Palaniyandavar Info Tech',
      line: calls ? (ta ? 'அழைப்புப் பட்டியல் ஏற்றப்படுகிறது…' : 'Loading your call list…') : (ta ? 'ஏற்றுகிறது…' : 'Loading…'),
    };
  })();
</script>
</head>
<body>
<div id="root">
  <div class="splash" role="status">
    <div class="splash-mark">
      <span class="splash-ring"></span><span class="splash-ring r2"></span>
      <img class="for-calls" src="/calls-icon-192.png" alt="" width="88" height="88">
      <span class="splash-mono for-site" aria-hidden="true">SP</span>
    </div>
    <div>
      <p class="splash-title" id="splash-title">Sir Palaniyandavar Info Tech</p>
      <p class="splash-sub for-calls">Sir Palaniyandavar Info Tech</p>
    </div>
    <div class="splash-bar" aria-hidden="true"><i></i></div>
    <p class="splash-line" id="splash-line">Loading…</p>
  </div>
  <script>
    document.getElementById('splash-title').textContent = window.__splashText.title;
    document.getElementById('splash-line').textContent = window.__splashText.line;
  </script>
</div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
